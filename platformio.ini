[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9

lib_deps =
    bblanchon/ArduinoJson@^6.21.1
    adafruit/DHT sensor library@^1.4.2
    adafruit/RTClib@^1.13.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.2
    ESP Async WebServer @ ^1.2.3

build_flags =
    -D LED_BUILTIN=2
